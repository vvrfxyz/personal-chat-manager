[project]
name = "personal-chat-manager-backend"
version = "0.1.0"
description = "Phase 1 MVP backend for Personal Chat Manager"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "telethon>=1.37",
  "cryptography>=43",
  "apscheduler>=3.10",
  "openai>=1.55",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
